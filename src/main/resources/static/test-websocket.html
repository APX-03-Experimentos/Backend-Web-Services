<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Native Test - APX Learn</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .control-panel { background: #f0f0f0; padding: 15px; margin: 10px 0; }
        #messages { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll; }
        button { padding: 10px; margin: 5px; }
        .message { margin: 5px 0; padding: 8px; border-left: 4px solid; }
        .connected { border-color: green; background: #e8f5e8; }
        .error { border-color: red; background: #ffebee; }
        .received { border-color: blue; background: #e3f2fd; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔔 WebSocket Native Test</h1>

    <div class="control-panel">
        <label><strong>User ID:</strong></label>
        <input type="number" id="userId" value="1">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="sendTest()">Send Test</button>
        <button onclick="clearMessages()">Clear</button>
    </div>

    <div id="connectionStatus" style="padding: 10px; margin: 10px 0;"></div>

    <div id="messages"></div>
</div>

<script>
    let stompClient = null;
    let websocket = null;

    function connect() {
        const userId = document.getElementById('userId').value;
        const wsUrl = `ws://localhost:8080/ws-notifications`;

        try {
            // Crear WebSocket nativo
            websocket = new WebSocket(wsUrl);
            stompClient = Stomp.over(websocket);

            stompClient.connect({}, function(frame) {
                updateStatus('✅ Connected to WebSocket', 'connected');

                // Suscribirse a notificaciones del usuario
                stompClient.subscribe(`/topic/user/${userId}/notifications`, function(message) {
                    const notification = JSON.parse(message.body);
                    addMessage(`📨 Notification: ${notification.title}`, 'received');
                    console.log('Received:', notification);
                });

            }, function(error) {
                updateStatus('❌ Connection failed: ' + error, 'error');
            });

        } catch (error) {
            updateStatus('❌ WebSocket error: ' + error, 'error');
        }
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        updateStatus('🔴 Disconnected', 'error');
    }

    function sendTest() {
        // Enviar solicitud de prueba al servidor
        fetch(`/api/test/send-notification/${document.getElementById('userId').value}`, {
            method: 'POST'
        })
            .then(response => response.text())
            .then(result => addMessage('🔄 ' + result, 'info'))
            .catch(error => addMessage('❌ Error: ' + error, 'error'));
    }

    function updateStatus(message, type) {
        const statusDiv = document.getElementById('connectionStatus');
        statusDiv.innerHTML = message;
        statusDiv.className = type;
    }

    function addMessage(text, type) {
        const messagesDiv = document.getElementById('messages');
        const messageElement = document.createElement('div');
        messageElement.className = `message ${type}`;
        messageElement.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> - ${text}`;
        messagesDiv.appendChild(messageElement);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function clearMessages() {
        document.getElementById('messages').innerHTML = '';
    }
</script>
</body>
</html>
